services:
  - type: web
    name: eventwise-ai
    runtime: node
    plan: free
    healthCheckPath: /api/health
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: ALLOW_MEMORY_STORE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        value: https://eventwise-ai-d11f.onrender.com
      # Accounts must be stored somewhere that survives restarts (Render's free plan sleeps and wipes memory).
      # Create a free Upstash Redis database and paste its REST URL / token here.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      # Optional: comma-separated emails that are always administrators (the first account to sign up is admin anyway).
      - key: ADMIN_EMAILS
        sync: false
      # Optional: Slack/Discord/Teams incoming-webhook URL, pinged when the API hits an unexpected error.
      - key: ALERT_WEBHOOK_URL
        sync: false

