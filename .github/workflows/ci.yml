name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test, Build & Audit Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Full Test Suite (vitest)
        run: npm test

      - name: Verify Production Build & Size Budget
        run: npm run build

      - name: Security Audit
        run: npm audit --audit-level=high
